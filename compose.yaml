services:
  frontend:
    image: fashion-online-store-frontend:local
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
